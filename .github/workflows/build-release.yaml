name: Build and Release opcuactl
run-name: Build and Release of opcuactl on '${{ github.ref_name }}' with bump '${{ github.event.inputs.bump }}'

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump strategy (none, patch, minor, major)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Bump version
        id: bump
        run: |
          VERSION=$(cat version.txt)
          IFS='.' read -r major minor patch <<< "$VERSION"
          case "${{ github.event.inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0 ;;
            minor)
              minor=$((minor + 1)); patch=0 ;;
            patch)
              patch=$((patch + 1)) ;;
            none)
              ;;
          esac
          NEW_VERSION="$major.$minor.$patch"
          echo "$NEW_VERSION" > version.txt
          git add version.txt
          if [[ "${{ github.event.inputs.bump }}" != "none" ]]; then
            git commit -m "Bump version to $NEW_VERSION"
            git push origin HEAD
          fi
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Show calculated version that will be built
        run: |
          echo "🔖 Final version to build: $(cat version.txt)"

  build:
    name: Build ${{ matrix.target }}
    needs: bump-version
    strategy:
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            target: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            target: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.target }}-

      - name: Build release binary
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          echo "$VERSION" > version.txt
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X 'github.com/otfabric/opcuactl/cmd/opcuactl.version=$VERSION' -X 'github.com/otfabric/opcuactl/cmd/opcuactl.commit=$COMMIT' -X 'github.com/otfabric/opcuactl/cmd/opcuactl.buildDate=$BUILD_DATE'"
          mkdir -p release
          go build -ldflags "$LDFLAGS" -o release/opcuactl .
          tar -czf release/opcuactl-$VERSION-${{ matrix.target }}.tar.gz -C release opcuactl
          rm -f release/opcuactl
          echo "Created release/opcuactl-$VERSION-${{ matrix.target }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opcuactl-${{ needs.bump-version.outputs.version }}-${{ matrix.target }}
          path: release/opcuactl-${{ needs.bump-version.outputs.version }}-${{ matrix.target }}.tar.gz

  create-github-release:
    name: Create GitHub Release
    needs:
      - bump-version
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: opcuactl-${{ needs.bump-version.outputs.version }}-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lah artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.version }}
          name: v${{ needs.bump-version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/*.tar.gz
